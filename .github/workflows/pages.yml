name: Publicar no GitHub Pages

# O site é servido do branch gh-pages; este workflow o mantém
# espelhando o branch de desenvolvimento a cada push.
on:
  push:
    branches: [claude/piquete-simulator-game-su3miy]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Espelhar para o gh-pages
        run: git push origin HEAD:gh-pages --force
